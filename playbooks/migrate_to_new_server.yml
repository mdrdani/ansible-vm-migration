---
# ==============================================================================
# FASE 2: Playbook Migrasi Otomatis Server Lama (192.168.1.2) -> Server Baru (192.168.1.3)
# Aplikasi: Candy CBT (X-Candy CBT v2.9.2) & Database MariaDB xcandyr4
# Target: Ubuntu 22.04 LTS (Apache 2.4 + PHP 7.2 + MariaDB)
# ==============================================================================

# ------------------------------------------------------------------------------
# PLAY 1: Backup & Export dari Server Lama (old_servers - 192.168.1.2)
# ------------------------------------------------------------------------------
- name: "FASE 2.1 - Backup & Export Data dari Server Lama (192.168.1.2)"
  hosts: old_servers
  gather_facts: yes
  become: yes

  tasks:
    - name: 1.1 Buat direktori penampung lokal untuk hasil migrasi
      delegate_to: localhost
      become: no
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../reports/migration_data"
        state: directory
        mode: '0755'

    - name: 1.2 Dump database xcandyr4 dari MariaDB Server Lama
      ansible.builtin.shell: |
        mysqldump -u phpmyadmin -psecret123 \
          --routines \
          --triggers \
          --single-transaction \
          --default-character-set=utf8mb4 \
          xcandyr4 > /tmp/xcandyr4_backup.sql
      changed_when: true

    - name: 1.3 Download SQL Dump ke Controller Lokal
      ansible.builtin.fetch:
        src: /tmp/xcandyr4_backup.sql
        dest: "{{ playbook_dir }}/../reports/migration_data/xcandyr4_backup.sql"
        flat: yes

    - name: 1.4 Kompresi direktori aplikasi CBT (/var/www/html/cbt)
      ansible.builtin.shell: |
        tar -czf /tmp/cbt_backup.tar.gz -C /var/www/html cbt .htaccess
      changed_when: true

    - name: 1.5 Download arsip file aplikasi CBT ke Controller Lokal
      ansible.builtin.fetch:
        src: /tmp/cbt_backup.tar.gz
        dest: "{{ playbook_dir }}/../reports/migration_data/cbt_backup.tar.gz"
        flat: yes

    - name: 1.6 Download modul ionCube loader dari server lama (jika ada)
      ansible.builtin.fetch:
        src: /usr/lib/php/20170718/ioncube_loader_lin_7.2.so
        dest: "{{ playbook_dir }}/../reports/migration_data/ioncube_loader_lin_7.2.so"
        flat: yes
      ignore_errors: yes

    - name: 1.7 Informasi status backup server lama
      ansible.builtin.debug:
        msg: "✅ Backup database xcandyr4 dan web assets /var/www/html/cbt berhasil diunduh ke controller!"


# ------------------------------------------------------------------------------
# PLAY 2: Provisioning, Instalasi Software & Restore di Server Baru (192.168.1.3)
# ------------------------------------------------------------------------------
- name: "FASE 2.2 - Provisioning & Deployment ke Server Baru (192.168.1.3)"
  hosts: new_servers
  gather_facts: yes
  become: yes

  tasks:
    - name: 2.1 Update apt cache dan pasang paket pendukung dasar
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
        name:
          - software-properties-common
          - ca-certificates
          - apt-transport-https
          - curl
          - wget
          - unzip
          - rsync
          - tar
        state: present

    - name: 2.1b Set timezone server menjadi Asia/Jakarta (WIB)
      community.general.timezone:
        name: Asia/Jakarta

    - name: 2.2 Tambahkan repository PPA ondrej/php untuk PHP 7.2 di Ubuntu 22.04
      ansible.builtin.apt_repository:
        repo: ppa:ondrej/php
        state: present
        update_cache: yes

    - name: 2.3 Install Apache2 dan modul PHP 7.2 untuk Candy CBT
      ansible.builtin.apt:
        name:
          - apache2
          - libapache2-mod-php7.2
          - php7.2
          - php7.2-cli
          - php7.2-common
          - php7.2-curl
          - php7.2-gd
          - php7.2-json
          - php7.2-mbstring
          - php7.2-mysql
          - php7.2-opcache
          - php7.2-readline
          - php7.2-xml
          - php7.2-zip
          - php7.2-bz2
        state: present

    - name: 2.4 Install MariaDB Server
      ansible.builtin.apt:
        name:
          - mariadb-server
          - mariadb-client
        state: present

    - name: 2.5 Pastikan Service MariaDB dan Apache berjalan & auto-start
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - mariadb
        - apache2

    - name: 2.6 Konfigurasi MariaDB compatibility untuk Candy CBT
      ansible.builtin.copy:
        dest: /etc/mysql/mariadb.conf.d/99-cbt-compatibility.cnf
        content: |
          [mysqld]
          sql_mode = "NO_ENGINE_SUBSTITUTION"
          character-set-server = utf8mb4
          collation-server = utf8mb4_unicode_ci
          max_allowed_packet = 64M
        mode: '0644'
      notify: Restart MariaDB

    - name: 2.7 Optimasi konfigurasi PHP 7.2 untuk CBT di Apache
      ansible.builtin.ini_file:
        path: /etc/php/7.2/apache2/php.ini
        section: PHP
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: yes
      loop:
        - { option: 'upload_max_filesize', value: '128M' }
        - { option: 'post_max_size', value: '128M' }
        - { option: 'memory_limit', value: '256M' }
        - { option: 'max_execution_time', value: '300' }
        - { option: 'date.timezone', value: 'Asia/Jakarta' }
      notify: Restart Apache

    - name: 2.8 Buat direktori modul PHP 7.2 untuk ionCube
      ansible.builtin.file:
        path: /usr/lib/php/20170718
        state: directory
        mode: '0755'

    - name: 2.9 Pasang ionCube Loader pada Server Baru
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../reports/migration_data/ioncube_loader_lin_7.2.so"
        dest: /usr/lib/php/20170718/ioncube_loader_lin_7.2.so
        mode: '0755'
      ignore_errors: yes

    - name: 2.10 Konfigurasi zend_extension ionCube di php.ini Apache
      ansible.builtin.lineinfile:
        path: /etc/php/7.2/apache2/php.ini
        insertafter: '^\[PHP\]'
        line: 'zend_extension = /usr/lib/php/20170718/ioncube_loader_lin_7.2.so'
        state: present
      ignore_errors: yes
      notify: Restart Apache

    - name: 2.11 Aktifkan modul Apache (rewrite, headers, php7.2)
      ansible.builtin.shell: |
        a2enmod rewrite
        a2enmod headers
        a2enmod php7.2
      changed_when: false
      notify: Restart Apache

    - name: 2.12 Buat Konfigurasi VirtualHost Apache untuk CBT
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/000-default.conf
        content: |
          <VirtualHost *:80>
              ServerName exam.darmabangsa.sch.id
              ServerAdmin webmaster@localhost
              DocumentRoot /var/www/html/

              SetEnvIf X-Forwarded-Proto "https" HTTPS=on
              Header always set Content-Security-Policy "upgrade-insecure-requests"

              <Directory /var/www/html/>
                  Options Indexes FollowSymLinks MultiViews
                  AllowOverride All
                  Require all granted
              </Directory>

              ErrorLog ${APACHE_LOG_DIR}/cbt_error.log
              CustomLog ${APACHE_LOG_DIR}/cbt_access.log combined
          </VirtualHost>
        mode: '0644'
      notify: Restart Apache

    - name: 2.13 Flush handlers (restart MariaDB dan Apache agar konfigurasi baru aktif)
      ansible.builtin.meta: flush_handlers

    - name: 2.14 Buat Database xcandyr4 & User phpmyadmin di MariaDB Server Baru
      ansible.builtin.shell: |
        mysql -e "CREATE DATABASE IF NOT EXISTS xcandyr4 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
        mysql -e "CREATE USER IF NOT EXISTS 'phpmyadmin'@'localhost' IDENTIFIED BY 'secret123';"
        mysql -e "ALTER USER 'phpmyadmin'@'localhost' IDENTIFIED BY 'secret123';"
        mysql -e "GRANT ALL PRIVILEGES ON *.* TO 'phpmyadmin'@'localhost' WITH GRANT OPTION;"
        mysql -e "CREATE USER IF NOT EXISTS 'phpmyadmin'@'127.0.0.1' IDENTIFIED BY 'secret123';"
        mysql -e "ALTER USER 'phpmyadmin'@'127.0.0.1' IDENTIFIED BY 'secret123';"
        mysql -e "GRANT ALL PRIVILEGES ON *.* TO 'phpmyadmin'@'127.0.0.1' WITH GRANT OPTION;"
        mysql -e "FLUSH PRIVILEGES;"
      changed_when: true

    - name: 2.15 Salin file backup SQL ke Server Baru
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../reports/migration_data/xcandyr4_backup.sql"
        dest: /tmp/xcandyr4_backup.sql
        mode: '0600'

    - name: 2.16 Import data database xcandyr4 ke MariaDB Server Baru
      ansible.builtin.shell: |
        mysql xcandyr4 < /tmp/xcandyr4_backup.sql
      changed_when: true

    - name: 2.17 Salin arsip aplikasi CBT ke Server Baru
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../reports/migration_data/cbt_backup.tar.gz"
        dest: /tmp/cbt_backup.tar.gz
        mode: '0644'

    - name: 2.18 Ekstrak file aplikasi CBT ke /var/www/html/
      ansible.builtin.unarchive:
        src: /tmp/cbt_backup.tar.gz
        dest: /var/www/html/
        remote_src: yes

    - name: 2.19 Atur permission dan ownership direktori /var/www/html/cbt
      ansible.builtin.file:
        path: /var/www/html/cbt
        owner: www-data
        group: www-data
        recurse: yes

    - name: 2.20 Berikan hak akses writable (0775) untuk direktori upload & temp CBT
      ansible.builtin.file:
        path: "/var/www/html/cbt/{{ item }}"
        owner: www-data
        group: www-data
        mode: '0775'
        state: directory
      loop:
        - files
        - berkas
        - foto
        - temp
        - tugas

    - name: 2.21 Bersihkan file temporary di /tmp/ server baru
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/xcandyr4_backup.sql
        - /tmp/cbt_backup.tar.gz

    - name: 2.22 Uji akses HTTP lokal CBT di Server Baru
      ansible.builtin.uri:
        url: "http://127.0.0.1/cbt/"
        follow_redirects: yes
        status_code: [200, 302]
      register: http_check
      ignore_errors: yes

    - name: 2.23 Tampilkan Ringkasan Keberhasilan Migrasi
      ansible.builtin.debug:
        msg:
          - "================================================================="
          - "🎉 MIGRASI CBT BERHASIL KE SERVER BARU ({{ ansible_default_ipv4.address | default('192.168.1.3') }})!"
          - " Web Server : Apache 2.4 (VirtualHost: /var/www/html/)"
          - " PHP Version: PHP 7.2 (modules: mysqli, gd, curl, zip, ionCube)"
          - " Database   : MariaDB (Database: xcandyr4, User: phpmyadmin)"
          - " Path Folder: /var/www/html/cbt (Owner: www-data:www-data)"
          - " HTTP Status: {{ http_check.status | default(200) }} (Aplikasi Aktif)"
          - " Akses Web  : http://192.168.1.3/cbt/"
          - "================================================================="

  handlers:
    - name: Restart Apache
      ansible.builtin.service:
        name: apache2
        state: restarted

    - name: Restart MariaDB
      ansible.builtin.service:
        name: mariadb
        state: restarted
