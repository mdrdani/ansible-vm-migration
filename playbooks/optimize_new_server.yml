---
# ==============================================================================
# Playbook Optimasi Performa CBT - Server Baru (192.168.1.3)
# Target: Ubuntu 22.04 LTS (1 vCPU, 2GB RAM, 208 Siswa)
# Stack: Apache Event MPM + PHP 7.2 FPM + OPcache + MariaDB High Concurrency
# ==============================================================================

- name: "Optimasi Penuh Performa Server Baru (192.168.1.3)"
  hosts: new_servers
  gather_facts: yes
  become: yes

  tasks:
    # --------------------------------------------------------------------------
    # 1. Pastikan PHP 7.2 FPM terinstall
    # --------------------------------------------------------------------------
    - name: 1.1 Pasang paket php7.2-fpm
      ansible.builtin.apt:
        name:
          - php7.2-fpm
        state: present

    # --------------------------------------------------------------------------
    # 2. Konfigurasi MariaDB High Concurrency & Aggressive Write Caching
    # --------------------------------------------------------------------------
    - name: 2.1 Pasang tuning konfigurasi MariaDB untuk lonjakan submit CBT
      ansible.builtin.copy:
        dest: /etc/mysql/mariadb.conf.d/99-cbt-performance.cnf
        content: |
          [mysqld]
          # Koneksi & Concurrency (Mendukung hingga 200 koneksi simultan)
          max_connections = 200
          max_user_connections = 180
          connect_timeout = 10
          wait_timeout = 60
          interactive_timeout = 60

          # Memory Buffer Pool (~384MB untuk RAM 2GB)
          innodb_buffer_pool_size = 384M
          innodb_log_file_size = 64M
          innodb_log_buffer_size = 16M
          innodb_file_per_table = 1

          # Write Caching Agresif (Sangat cepat untuk submit jawaban massal)
          innodb_flush_log_at_trx_commit = 2
          innodb_flush_method = O_DIRECT

          # Tabel Temporary & Cache
          tmp_table_size = 32M
          max_heap_table_size = 32M
          table_open_cache = 400

          # Kompatibilitas Candy CBT
          sql_mode = "NO_ENGINE_SUBSTITUTION"
          character-set-server = utf8mb4
          collation-server = utf8mb4_unicode_ci
          max_allowed_packet = 64M
        mode: '0644'
      notify: Restart MariaDB

    # --------------------------------------------------------------------------
    # 3. Konfigurasi PHP-FPM Pool & Tuning Resource
    # --------------------------------------------------------------------------
    - name: 3.1 Konfigurasi FPM Pool www.conf (Dynamic Process Management)
      ansible.builtin.copy:
        dest: /etc/php/7.2/fpm/pool.d/www.conf
        content: |
          [www]
          user = www-data
          group = www-data
          listen = /run/php/php7.2-fpm.sock
          listen.owner = www-data
          listen.group = www-data
          listen.mode = 0660

          pm = dynamic
          pm.max_children = 35
          pm.start_servers = 8
          pm.min_spare_servers = 5
          pm.max_spare_servers = 15
          pm.max_requests = 1000

          request_terminate_timeout = 300s
        mode: '0644'
      notify: Restart PHP-FPM

    - name: 3.2 Konfigurasi php.ini untuk PHP-FPM
      ansible.builtin.ini_file:
        path: /etc/php/7.2/fpm/php.ini
        section: PHP
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: yes
      loop:
        - { option: 'upload_max_filesize', value: '128M' }
        - { option: 'post_max_size', value: '128M' }
        - { option: 'memory_limit', value: '256M' }
        - { option: 'max_execution_time', value: '300' }
        - { option: 'date.timezone', value: 'Asia/Jakarta' }
        - { option: 'expose_php', value: 'Off' }
      notify: Restart PHP-FPM

    - name: 3.3 Konfigurasi OPcache Agresif pada PHP-FPM
      ansible.builtin.ini_file:
        path: /etc/php/7.2/fpm/php.ini
        section: opcache
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: yes
      loop:
        - { option: 'opcache.enable', value: '1' }
        - { option: 'opcache.enable_cli', value: '0' }
        - { option: 'opcache.memory_consumption', value: '128' }
        - { option: 'opcache.interned_strings_buffer', value: '16' }
        - { option: 'opcache.max_accelerated_files', value: '10000' }
        - { option: 'opcache.revalidate_freq', value: '60' }
        - { option: 'opcache.save_comments', value: '1' }
        - { option: 'opcache.fast_shutdown', value: '1' }
      notify: Restart PHP-FPM

    - name: 3.4 Pasang modul ionCube Loader di PHP-FPM
      ansible.builtin.lineinfile:
        path: /etc/php/7.2/fpm/php.ini
        insertafter: '^\[PHP\]'
        line: 'zend_extension = /usr/lib/php/20170718/ioncube_loader_lin_7.2.so'
        state: present
      ignore_errors: yes
      notify: Restart PHP-FPM

    # --------------------------------------------------------------------------
    # 4. Migrasi Apache ke MPM Event (Non-blocking & High Concurrency)
    # --------------------------------------------------------------------------
    - name: 4.1 Tuning konfigurasi Apache MPM Event
      ansible.builtin.copy:
        dest: /etc/apache2/mods-available/mpm_event.conf
        content: |
          <IfModule mpm_event_module>
              StartServers             2
              MinSpareThreads          25
              MaxSpareThreads          75
              ThreadLimit              64
              ThreadsPerChild          25
              MaxRequestWorkers        150
              MaxConnectionsPerChild   1000
          </IfModule>
        mode: '0644'
      notify: Restart Apache

    - name: 4.2 Nonaktifkan mod_php dan mpm_prefork di Apache
      ansible.builtin.shell: |
        a2dismod php7.2 || true
        a2dismod mpm_prefork || true
      changed_when: false

    - name: 4.3 Aktifkan mpm_event, proxy_fcgi, dan php7.2-fpm
      ansible.builtin.shell: |
        a2enmod mpm_event
        a2enmod proxy_fcgi setenvif
        a2enconf php7.2-fpm
        a2enmod rewrite
        a2enmod headers
      changed_when: false
      notify: Restart Apache

    # --------------------------------------------------------------------------
    # 5. Flush Handlers & Verifikasi
    # --------------------------------------------------------------------------
    - name: 5.1 Terapkan restart semua service secara berurutan
      ansible.builtin.meta: flush_handlers

    - name: 5.2 Pastikan PHP 7.2 FPM dan Apache berjalan
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - php7.2-fpm
        - apache2
        - mariadb

    - name: 5.3 Uji respon HTTP dan PHP processing aplikasi CBT
      ansible.builtin.uri:
        url: "http://127.0.0.1/cbt/"
        headers:
          Host: "exam.darmabangsa.sch.id"
          X-Forwarded-Proto: "https"
        status_code: [200, 302]
      register: http_test

    - name: 5.4 Tampilkan Ringkasan Hasil Optimasi
      ansible.builtin.debug:
        msg:
          - "================================================================="
          - "🚀 OPTIMASI PERFORMA SERVER 192.168.1.3 SELESAI!"
          - " Architecture : Apache MPM Event (Asynchronous & Non-blocking)"
          - " PHP Handler  : PHP-FPM 7.2 (Socket: /run/php/php7.2-fpm.sock)"
          - " PHP OPcache  : AKTIF (128MB Memory Pre-compiled Cache)"
          - " MariaDB      : Buffer Pool 384MB + innodb_flush_log_at_trx_commit = 2"
          - " Max Concur.  : Siap menangani 150-200 request siswa bersamaan"
          - " HTTP Status  : {{ http_test.status }} OK"
          - "================================================================="

  handlers:
    - name: Restart MariaDB
      ansible.builtin.service:
        name: mariadb
        state: restarted

    - name: Restart PHP-FPM
      ansible.builtin.service:
        name: php7.2-fpm
        state: restarted

    - name: Restart Apache
      ansible.builtin.service:
        name: apache2
        state: restarted
